services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rankrascal
      POSTGRES_USER: rankrascal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rank-rascal-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankrascal -d rankrascal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rank-rascal-postgres:/var/lib/postgresql/data

  rank-rascal:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rankrascal:${POSTGRES_PASSWORD:-rank-rascal-local-only}@postgres:5432/rankrascal
      DATABASE_SSL: "false"
      REQUIRE_POSTGRES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  rank-rascal-postgres:
